[package]
name = "ikigai-json"
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "JSON and CSV as resources for ikigai: urn:json:query runs a jq program (jaq) over any resource, and CSV reads as JSON through a registered transreptor."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-json"
homepage = "https://github.com/ikigai-rs/ikigai-json"
readme = "README.md"
keywords = ["ikigai", "roc", "jq", "csv", "json"]
categories = ["wasm", "parser-implementations"]

[dependencies]
# 0.2.0 is the streams release (ledger #2261). Under 0.x rules, the old
# 0.1 pin meant <0.2.0.
ikigai-core = "0.2.1"
# jaq: a jq implementation in Rust (MIT, Michael Faerber). 3.1 is the line whose parser
# and compiler API (`load::parse`, `Loader::new(prelude)`, `Native::with_update`) the
# sandbox rewrites programs through; its syntax tree is matched exhaustively, so a new
# term variant upstream is a compile error here rather than an unguarded construct.
jaq-core = "3.1.2"
# Default features: the time functions (UTC only are offered), math, format. The
# natives that read the environment, the clock or the log are filtered out by name.
jaq-std = "3.0.4"
jaq-json = "2.0.3"
# RFC 4180 reading and writing.
csv = "1.4"

async-trait = "0.1"
futures = "0.3"
csv-core = "0.1"

[dev-dependencies]
ikigai-conformance = "0.11.0"
